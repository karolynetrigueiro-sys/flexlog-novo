
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#071a33">
<title>FlexLog | Rastreamento</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#f2f5fa;
 color:#15243a;
}
header{
 background:#071a33;
 color:white;
 padding:25px 20px;
}
.container{
 max-width:650px;
 margin:auto;
}
.logo{
 font-size:27px;
 font-weight:bold;
 color:#45b4ff;
}
header p{color:#c4d2e5}
main{padding:35px 18px}
.card{
 background:white;
 padding:25px;
 border-radius:16px;
 box-shadow:0 5px 25px #14243a12;
}
h1{font-size:25px;margin-top:0}
input{
 width:100%;
 padding:16px;
 border:1px solid #d5dce7;
 border-radius:9px;
 font-size:16px;
 margin:15px 0;
}
button{
 width:100%;
 background:#087cf0;
 color:white;
 border:0;
 padding:16px;
 border-radius:9px;
 font-size:16px;
 font-weight:bold;
 cursor:pointer;
}
button:active{opacity:.8}
#resultado{display:none;margin-top:25px}
.status{
 background:#eaf4ff;
 color:#0871d9;
 padding:14px;
 border-radius:9px;
 font-weight:bold;
}
.evento{
 border-left:3px solid #087cf0;
 padding:5px 0 18px 17px;
 margin-left:7px;
}
.evento:last-child{border-left-color:transparent}
.evento strong{display:block;margin-bottom:5px}
.evento small{color:#75849a}
.erro{color:#d32f2f;margin-top:15px}
footer{
 text-align:center;
 color:#8290a3;
 padding:25px;
 font-size:13px;
}
</style>
</head>

<body>

<header>
 <div class="container">
  <div class="logo">FlexLog</div>
  <p>Seu objeto, acompanhado em cada etapa.</p>
 </div>
</header>

<main>
<div class="container">
 <div class="card">
  <h1>Rastreie sua encomenda</h1>
  <p>Digite seu código de rastreamento para consultar a situação do objeto.</p>

  <input
   id="codigo"
   type="text"
   placeholder="Digite seu código de rastreamento"
   autocomplete="off"
  >

  <button onclick="rastrear()">Consultar encomenda</button>

  <div id="erro" class="erro"></div>

  <div id="resultado">
   <h2>Detalhes da encomenda</h2>
   <div class="status" id="situacao"></div>
   <p id="destino"></p>

   <h3>Histórico de movimentação</h3>
   <div id="historico"></div>
  </div>
 </div>
</div>
</main>

<footer>
 FlexLog © 2026 - Sistema demonstrativo de rastreamento.
</footer>

<script>
const encomendas = {
 "BR354790239": {
  situacao:"Objeto em trânsito",
  destino:"Destino: Unidade de distribuição",
  eventos:[
   {
    titulo:"Objeto recebido",
    data:"09/11/2026 - 09:30",
    local:"Centro de distribuição"
   },
   {
    titulo:"Objeto em trânsito",
    data:"09/11/2026 - 14:20",
    local:"Transferência entre unidades"
   }
  ]
 }
};

function rastrear(){
 const codigo=document.getElementById("codigo").value
 .trim().toUpperCase();

 const resultado=document.getElementById("resultado");
 const erro=document.getElementById("erro");

 resultado.style.display="none";
 erro.textContent="";

 if(!codigo){
  erro.textContent="Digite um código para consultar.";
  return;
 }

 const objeto=encomendas[codigo];

 if(!objeto){
  erro.textContent="Código não encontrado. Verifique e tente novamente.";
  return;
 }

 document.getElementById("situacao").textContent=objeto.situacao;
 document.getElementById("destino").textContent=objeto.destino;

 document.getElementById("historico").innerHTML=
 objeto.eventos.map(evento=>`
  <div class="evento">
   <strong>${evento.titulo}</strong>
   <small>${evento.data}</small>
   <p>${evento.local}</p>
  </div>
 `).join("");

 resultado.style.display="block";
}
</script>

</body>
</html>
